<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notifications | Lost & Found</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="navbar">

        <div class="container nav-content">

            <a href="dashboard.html" class="logo">
                Lost<span>&</span>Found
            </a>


            <nav class="nav-links">

                <a href="dashboard.html">
                    Dashboard
                </a>

                <a href="lost.html">
                    Lost
                </a>

                <a href="found.html">
                    Found
                </a>

                <a href="notifications.html" class="active">
                    🔔
                </a>

            </nav>

        </div>

    </header>


    <main>

        <section class="page-header">

            <div class="container">

                <span>
                    NOTIFICATIONS
                </span>

                <h1>
                    Your Notifications
                </h1>

                <p>
                    Stay updated about potential matches, claims and item status.
                </p>

            </div>

        </section>


        <section class="section">

            <div class="container notification-container">

                <div class="notification-toolbar">

                    <h2>
                        Recent Notifications
                    </h2>

                    <button type="button" class="text-button" id="markAllRead">
                        Mark all as read
                    </button>

                </div>


                <div id="notificationsList" class="notifications-list">

                    <!-- Dynamic notifications will appear here -->

                    <div class="empty-state">

                        <div class="empty-icon">
                            🔔
                        </div>

                        <h3>
                            No notifications
                        </h3>

                        <p>
                            You're all caught up.
                        </p>

                    </div>

                </div>

            </div>

        </section>

    </main>


    <script src="js/main.js"></script>
    <script src="js/notifications.js"></script>

</body>

</html>
